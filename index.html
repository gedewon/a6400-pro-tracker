<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="a6400 Pro">
<meta name="description" content="Daily training tracker for learning photography and cinematic video with a Sony a6400 in Berlin.">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>a6400 Pro Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* shadcn/ui neutral base + Tangerine primary. Layout: one 720px column; segmented tabs on desktop, icon tab bar on phones */
  --background:#fafafa; --foreground:#0a0a0a;
  --card:#ffffff; --card-foreground:#0a0a0a;
  --primary:#e05d38; --primary-foreground:#ffffff;
  --secondary:#f4f4f5; --secondary-foreground:#18181b;
  --muted:#f4f4f5; --muted-foreground:#71717a;
  --border:#e4e4e7; --input:#e4e4e7; --ring:#e05d38;
  --success:#16a34a;
  --t-learn:#2563eb; --t-drill:#7c3aed; --t-shoot:#e05d38; --t-edit:#0d9488; --t-study:#16a34a; --t-rest:#71717a; --t-bonus:#db2777;
  --radius:0.75rem;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .08),0 1px 2px -1px rgb(0 0 0 / .06);
  --shadow-lg:0 10px 30px -10px rgb(0 0 0 / .25),0 4px 10px -6px rgb(0 0 0 / .1);
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --background:#0a0a0a; --foreground:#fafafa;
    --card:#141414; --card-foreground:#fafafa;
    --primary:#ec6a44; --primary-foreground:#ffffff;
    --secondary:#262626; --secondary-foreground:#fafafa;
    --muted:#1f1f1f; --muted-foreground:#a1a1aa;
    --border:#ffffff1a; --input:#ffffff26; --ring:#ec6a44;
    --success:#4ade80;
    --t-learn:#60a5fa; --t-drill:#a78bfa; --t-shoot:#f0825f; --t-edit:#2dd4bf; --t-study:#4ade80; --t-rest:#a1a1aa; --t-bonus:#f472b6;
    --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .4);
    --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .5);
    --shadow-lg:0 12px 32px -12px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --background:#0a0a0a; --foreground:#fafafa;
  --card:#141414; --card-foreground:#fafafa;
  --primary:#ec6a44; --primary-foreground:#ffffff;
  --secondary:#262626; --secondary-foreground:#fafafa;
  --muted:#1f1f1f; --muted-foreground:#a1a1aa;
  --border:#ffffff1a; --input:#ffffff26; --ring:#ec6a44;
  --success:#4ade80;
  --t-learn:#60a5fa; --t-drill:#a78bfa; --t-shoot:#f0825f; --t-edit:#2dd4bf; --t-study:#4ade80; --t-rest:#a1a1aa; --t-bonus:#f472b6;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .4);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .5);
  --shadow-lg:0 12px 32px -12px rgb(0 0 0 / .7);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font:400 14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted-foreground)}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;letter-spacing:-.025em}
.app{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
@media (min-width:768px){.app{padding:32px 24px 48px}}

/* ---------- Header ---------- */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:var(--shadow-sm);flex:none}
.logo svg.i{width:18px;height:18px}
.brand-title{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted-foreground);line-height:1.2}

/* ---------- Badge ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;line-height:16px;white-space:nowrap}
.badge-outline{border-color:var(--border);color:var(--foreground);background:var(--card)}
.badge-type{color:color-mix(in oklab,var(--tc) 85%,var(--foreground));background:color-mix(in oklab,var(--tc) 12%,transparent);border-color:color-mix(in oklab,var(--tc) 22%,transparent)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted-foreground);flex:none}
#sync[data-s="synced"] .dot{background:var(--success)}
#sync[data-s="saving"] .dot,#sync[data-s="connecting"] .dot{background:#f59e0b}
#sync[data-s="offline"] .dot,#sync[data-s="error"] .dot{background:var(--primary)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:calc(var(--radius) - 4px);font-size:14px;font-weight:500;white-space:nowrap;border:1px solid transparent;outline:none;
  transition:transform 160ms var(--ease-out),background-color 200ms ease,border-color 200ms ease,color 200ms ease,box-shadow 150ms ease}
.btn:active{transform:scale(.97)}
.btn:focus-visible{box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent);border-color:var(--ring)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-xs)}
.btn-outline{background:var(--card);border-color:var(--border);box-shadow:var(--shadow-xs)}
.btn-ghost{color:var(--foreground)}
.btn-lg{height:44px;padding:0 20px;font-size:15px}
.btn-icon{width:36px;padding:0}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:color-mix(in oklab,var(--primary) 90%,var(--foreground))}
  .btn-outline:hover,.btn-ghost:hover{background:var(--muted)}
}
.btn-done[aria-pressed="true"]{background:color-mix(in oklab,var(--success) 12%,var(--card));color:var(--success);border-color:color-mix(in oklab,var(--success) 35%,transparent);box-shadow:none}
.btn-label{display:inline-flex;align-items:center;gap:8px;transition:filter 200ms ease,opacity 200ms ease}
.btn-label.swapping{filter:blur(2px);opacity:.5}
.link{color:var(--primary);font-weight:500;text-underline-offset:4px}
@media (hover:hover) and (pointer:fine){.link:hover{text-decoration:underline}}

/* ---------- Tabs ---------- */
.tabs-list{display:none}
@media (min-width:768px){
  .tabs-list{display:grid;grid-template-columns:repeat(5,1fr);background:var(--muted);border-radius:calc(var(--radius) - 2px);padding:3px;margin-bottom:24px;height:40px}
  .tabs-list a{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:calc(var(--radius) - 4px);font-size:14px;font-weight:500;color:var(--muted-foreground);text-decoration:none;border:1px solid transparent}
  .tabs-list a[aria-current="page"]{background:var(--card);color:var(--foreground);box-shadow:var(--shadow-sm);border-color:var(--border)}
  .tabbar{display:none}
}
@media (hover:hover) and (pointer:fine){.tabs-list a:hover{color:var(--foreground)}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--border)}
.tabbar a{display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted-foreground);text-decoration:none;border-radius:10px;transition:transform 160ms var(--ease-out)}
.tabbar a:active{transform:scale(.94)}
.tabbar a svg.i{width:20px;height:20px}
.tabbar a[aria-current="page"]{color:var(--foreground)}
.tabbar a[aria-current="page"] svg.i{color:var(--primary)}
@media (min-width:768px){.tabbar{display:none}}
a:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}

/* ---------- Card ---------- */
.view{display:grid;gap:16px}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:20px;padding:20px}
@media (min-width:768px){.card{padding:24px}}
.card-header{display:grid;gap:6px}
.card-header.split{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-title{font-weight:600;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card-desc{font-size:14px;color:var(--muted-foreground)}
.card-footer{display:flex;gap:8px;align-items:center}

/* ---------- Page heading ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:600;line-height:1.15}
@media (min-width:768px){.page-head h1{font-size:28px}}
.page-head .sub{color:var(--muted-foreground);font-size:14px;margin-top:4px}
.head-actions{display:flex;gap:6px;align-items:center}

/* ---------- Today hero ---------- */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tc)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted-foreground)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:14px;height:14px}
.hero-title{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
@media (min-width:768px){.hero-title{font-size:26px}}
.hero-desc{font-size:15px;color:var(--muted-foreground);max-width:60ch;line-height:1.6}
.location{display:flex;gap:12px;align-items:flex-start;background:var(--muted);border-radius:calc(var(--radius) - 2px);padding:12px 14px}
.location .pin{width:32px;height:32px;border-radius:8px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;color:var(--primary);flex:none}
.location b{display:block;font-weight:500;font-size:14px;line-height:1.4}
.location small{font-size:12px;color:var(--muted-foreground)}
.hero .card-footer .btn-done{flex:1}

/* ---------- Stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:16px;gap:10px}
.stat .label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted-foreground)}
.stat .label svg.i{width:14px;height:14px}
.stat .value{font-size:24px;font-weight:600;line-height:1}
@media (max-width:420px){.stat{padding:12px}.stat .value{font-size:20px}.stats{gap:8px}}

/* ---------- Progress ---------- */
.progress{position:relative;height:6px;width:100%;overflow:hidden;border-radius:999px;background:color-mix(in oklab,var(--primary) 18%,transparent)}
.progress > i{position:absolute;inset:0;background:var(--primary);border-radius:999px;transform:translateX(-100%);transition:transform 300ms var(--ease-out)}

/* ---------- Week strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:4px;padding:10px 0 8px;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);background:var(--card);
  transition:transform 160ms var(--ease-out),background-color 200ms ease,border-color 200ms ease}
.day:active{transform:scale(.95)}
.day .dw{font-size:11px;color:var(--muted-foreground);font-weight:500}
.day .dn{font-size:15px;font-weight:600}
.day .mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--tc) 18%,transparent)}
.day .mk::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.day.is-done{background:color-mix(in oklab,var(--primary) 9%,var(--card));border-color:color-mix(in oklab,var(--primary) 35%,transparent)}
.day.is-done .mk{background:var(--primary)}
.day.is-done .mk::after{width:8px;height:5px;border-radius:0;background:none;border:solid var(--primary-foreground);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.day.is-sel{box-shadow:0 0 0 2px var(--foreground)}
.day.placeholder{visibility:hidden}
@media (hover:hover) and (pointer:fine){.day:hover{border-color:color-mix(in oklab,var(--foreground) 25%,transparent)}}

/* ---------- Checkbox ---------- */
.cb{appearance:none;-webkit-appearance:none;margin:0;width:18px;height:18px;flex:none;border:1px solid color-mix(in oklab,var(--foreground) 22%,transparent);border-radius:5px;background:var(--card);box-shadow:var(--shadow-xs);display:grid;place-items:center;cursor:pointer;
  transition:background-color 150ms ease,border-color 150ms ease,transform 160ms var(--ease-out)}
.cb::after{content:"";width:9px;height:5px;border:solid var(--primary-foreground);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg) scale(.6);opacity:0;transition:transform 150ms var(--ease-out),opacity 150ms ease}
.cb:checked{background:var(--primary);border-color:var(--primary)}
.cb:checked::after{opacity:1;transform:translateY(-1px) rotate(-45deg) scale(1)}
.cb:active{transform:scale(.9)}
.cb-lg{width:22px;height:22px;border-radius:6px}

/* ---------- Plan list ---------- */
.week-card{padding:0;gap:0;overflow:hidden}
.week-card .card-header{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.week-card .wk-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.week-card .progress{margin-top:10px}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--border);transition:background-color 150ms ease}
.row:first-child{border-top:0}
.row.is-today{background:color-mix(in oklab,var(--primary) 6%,transparent)}
.row-main{display:grid;gap:2px;min-width:0;text-align:left}
.row-title{font-weight:500;font-size:14px;line-height:1.35;transition:color 150ms ease}
.row-sub{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-date{font-size:12px;color:var(--muted-foreground);text-align:right;display:grid;justify-items:end;gap:4px}
.row.is-done .row-title{color:var(--muted-foreground);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--muted-foreground) 60%,transparent)}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--muted)}.row-main:hover .row-title{color:var(--primary)}}

/* ---------- Day map ---------- */
.heat{max-width:400px;display:grid;grid-template-columns:28px repeat(7,1fr);gap:6px;align-items:center}
.heat .h,.heat .wl{font-size:11px;color:var(--muted-foreground);text-align:center;font-family:var(--font-mono)}
.heat .wl{text-align:left}
.cell{aspect-ratio:1;border-radius:6px;background:var(--muted);border:1px solid var(--border);transition:transform 160ms var(--ease-out),background-color 200ms ease}
.cell:active{transform:scale(.9)}
.cell.is-done{background:var(--primary);border-color:var(--primary)}
.cell.missed:not(.is-done){background:color-mix(in oklab,var(--foreground) 12%,var(--muted))}
.cell.rest:not(.is-done){background:transparent;border-style:dashed}
.cell.today{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--foreground)}
.cell.none{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--border);background:var(--muted)}

/* ---------- Roadmap ---------- */
.phases{display:grid}
.phase{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.phase:first-child{border-top:0;padding-top:0}
.phase .pn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--muted);color:var(--muted-foreground);font-family:var(--font-mono)}
.phase.current .pn{background:var(--primary);color:var(--primary-foreground)}
.phase.complete .pn{background:color-mix(in oklab,var(--success) 15%,transparent);color:var(--success)}
.phase .pt{font-weight:500;font-size:14px}
.phase .ps{font-size:12px;color:var(--muted-foreground)}
.phase .progress{grid-column:2/-1}

/* ---------- Checklists ---------- */
.checks{display:grid;margin:-6px -8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.45}
.check .cb{margin-top:1px}
.check span{transition:color 150ms ease}
.check.is-done span{color:var(--muted-foreground);text-decoration:line-through}
@media (hover:hover) and (pointer:fine){.check:hover{background:var(--muted)}}

/* ---------- Textarea / journal ---------- */
.field{display:grid;gap:8px}
.field label{font-size:14px;font-weight:500}
.textarea{width:100%;min-height:64px;field-sizing:content;resize:vertical;border:1px solid var(--input);background:transparent;border-radius:calc(var(--radius) - 4px);padding:8px 12px;font-size:14px;line-height:1.5;box-shadow:var(--shadow-xs);outline:none;transition:border-color 150ms ease,box-shadow 150ms ease}
.textarea::placeholder{color:var(--muted-foreground)}
.textarea:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
.saved-hint{font-size:12px;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:6px}
.entry dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.entry dt{font-size:12px;color:var(--muted-foreground);padding-top:2px}
.entry dd{margin:0;font-size:14px}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:40px 20px}
.empty .ic{width:44px;height:44px;border-radius:12px;background:var(--muted);display:grid;place-items:center;color:var(--muted-foreground)}
.empty .ic svg.i{width:20px;height:20px}

/* ---------- Next-up row ---------- */
.next{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;width:100%}
.next .grow{flex:1;min-width:0}
.next .t{font-weight:500}
.next .s{font-size:12px;color:var(--muted-foreground)}
.next svg.i{color:var(--muted-foreground)}


/* ---------- Video ---------- */
.video{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:10px 12px;text-decoration:none;color:inherit;background:var(--card);
  transition:transform 160ms var(--ease-out),border-color 200ms ease,background-color 200ms ease}
.video:active{transform:scale(.98)}
.video .vt{width:40px;height:40px;border-radius:9px;background:color-mix(in oklab,#ff0033 12%,transparent);color:#e00028;display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .video .vt{color:#ff4d6a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .video .vt{color:#ff4d6a}}
.video .vt svg.i{width:20px;height:20px}
.video .vb{flex:1;min-width:0;display:grid;gap:1px}
.video .vb b{font-weight:500;font-size:14px;line-height:1.35}
.video .vb small{font-size:12px;color:var(--muted-foreground)}
.video > svg.i{color:var(--muted-foreground)}
@media (hover:hover) and (pointer:fine){.video:hover{background:var(--muted);border-color:color-mix(in oklab,var(--foreground) 20%,transparent)}}
.videos{display:grid;gap:8px}
.vid-dot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#e00028;font-weight:500}
.vid-dot svg.i{width:12px;height:12px}
.section-label{font-size:12px;font-weight:500;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em}

/* ---------- Toast (Sonner-like) ---------- */

const DAY=864e5;
const addDays=(k,n)=>new Date(Date.parse(k+"T12:00:00Z")+n*DAY).toISOString().slice(0,10);
const dowOf=k=>(new Date(k+"T12:00:00Z").getUTCDay()+6)%7; /* Mon=0 … Sun=6 */
function mk(id,date,w,i,d,extra){return {key:id,date,week:w,slot:i,dow:dowOf(date),type:d[0],hours:d[1],title:d[2],detail:d[3],place:d[4]||"",time:d[5]||"",extra:!!extra};}
/* Weeks 2–8 run Monday→Sunday so long shoots land on weekends. Week 1 starts on your start day; if that isn't a Monday it
   stretches to the Sunday of the following week: weekday tasks take the first weekday slots, the weekend walk and import take
   the last weekend, and spare days become optional catch-up days or free shoots. */
function buildSchedule(start){
  const out=[],s0=dowOf(start),len=s0===0?7:14-s0;
  const slots=[];for(let i=0;i<len;i++)slots.push(addDays(start,i));
  const wdSlots=slots.filter(k=>dowOf(k)<5).slice(0,5),weSlots=slots.filter(k=>dowOf(k)>=5).slice(-2);
  const w1=WEEKS[0].days;let x=0;
  slots.forEach(k=>{
    const a=wdSlots.indexOf(k),b=weSlots.indexOf(k);
    if(a>=0)out.push(mk("1-"+a,k,1,a,w1[a]));
    else if(b>=0)out.push(mk("1-"+(5+b),k,1,5+b,w1[5+b]));
    else out.push(mk("1-x"+(x++),k,1,-1,dowOf(k)>=5?EXTRA_WEEKEND:EXTRA_WEEKDAY,true));
  });
  let mon=addDays(start,len);
  for(let wi=1;wi<WEEKS.length;wi++){const w=WEEKS[wi];w.days.forEach((d,i)=>out.push(mk(w.n+"-"+i,addDays(mon,i),w.n,i,d)));mon=addDays(mon,7);}
  out.forEach((d,i)=>d.idx=i);
  return out;
}

}

const OLD_W1=[0,2,3,4,5,6];
function migrateKey(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return k;const c=Math.round((Date.parse(k+"T00:00:00Z")-Date.UTC(2026,11,1))/DAY);if(c<0||c>54)return null;if(c<6)return "1-"+OLD_W1[c];const r=c-6;return (2+Math.floor(r/7))+"-"+(r%7);}
function migrateMap(m){const out={};for(const k in m){const n=migrateKey(k);if(n)out[n]=m[k];}return out;}
function normalize(o){const b=blank();if(o&&typeof o==="object"){if(typeof o.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.start))b.start=o.start;if(o.done&&typeof o.done==="object")b.done=Object.assign({},o.done);if(o.checks&&typeof o.checks==="object")b.checks=Object.assign({},o.checks);if(o.journal&&typeof o.journal==="object"){for(const k in o.journal){const j=o.journal[k]||{};b.journal[k]={w:String(j.w||""),f:String(j.f||""),n:String(j.n||"")};}}}b.done=migrateMap(b.done);b.journal=migrateMap(b.journal);return b;}
let S=blank();
try{const raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw));}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
const sig=o=>JSON.stringify([o.start,o.done,o.checks,o.journal]);
let sel=null;

/* ---------- Sync ---------- */
let ref=null,dirty=false,writing=false,timer=null,gotServer=false,status="connecting";
const STATUS={
 connecting:["Connecting","Connecting to your Claude account to load your progress."],
 synced:["Synced","Saved to your Claude account. Open this page on your phone or another computer, signed in to the same account, to pick up where you left off."],
 saving:["Saving","Saving your latest change to your Claude account."],
 local:["Saved on this device","Progress is saved in this browser and works offline. To continue on another device, open Lists → Backup & move progress, copy the code, and paste it on the other device."],
 offline:["Offline","Can't reach your Claude account right now. Changes stay on this device and sync when the connection returns."],
 error:["Sync error","Your last change couldn't be saved to your account. It's kept on this device; try again in a moment."]
};
function setStatus(s){status=s;const b=document.getElementById("sync");b.dataset.s=s;document.getElementById("synctext").textContent=STATUS[s][0];const p=document.getElementById("syncpop");if(!p.hidden)p.textContent=STATUS[s][1];}
document.getElementById("sync").addEventListener("click",()=>{const p=document.getElementById("syncpop"),b=document.getElementById("sync");p.hidden=!p.hidden;b.setAttribute("aria-expanded",String(!p.hidden));p.textContent=STATUS[status][1];});
function queueWrite(delay){saveLocal();if(!ref)return;dirty=true;setStatus("saving");clearTimeout(timer);timer=setTimeout(flush,delay==null?700:delay);}
async function flush(){
  if(!ref)return;
  if(writing){clearTimeout(timer);timer=setTimeout(flush,300);return;}
  writing=true;dirty=false;
  const body=JSON.parse(JSON.stringify({start:S.start||null,done:S.done,checks:S.checks,journal:S.journal,updatedAt:new Date().toISOString()}));
  let retry=false;
  try{await ref.set(body);}catch(e){if(e&&(e.code==="unavailable"||!e.code)){retry=true;dirty=true;}else{setStatus("error");}}
  writing=false;
  if(dirty){clearTimeout(timer);timer=setTimeout(flush,retry?1500+Math.random()*1000:500);setStatus(retry?"offline":"saving");}
  else if(status!=="error")setStatus("synced");
}
async function initSync(){
  if(!window.claude||typeof window.claude.use!=="function"){setStatus("local");return;}
  const loadTimer=setTimeout(()=>{if(!gotServer)setStatus(ref?"offline":"local");},10000);
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){clearTimeout(loadTimer);setStatus("local");return;}
    ref=db.doc("data/users/"+uid+"/tracker");
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache&&!gotServer){gotServer=true;clearTimeout(loadTimer);}
      if(snap.exists){
        if(!dirty&&!writing){const next=normalize(snap.data());if(sig(next)!==sig(S)){S=next;saveLocal();render();}}
      }else if(!snap.metadata.fromCache){
        if(Object.keys(S.done).length||Object.keys(S.checks).length||Object.keys(S.journal).length)queueWrite(0);
      }
      if(gotServer&&!dirty&&!writing&&status!=="error")setStatus("synced");
    },()=>{clearTimeout(loadTimer);setStatus("offline");});
  }catch(e){clearTimeout(loadTimer);setStatus("local");}
}

/* ---------- Derived ---------- */
function focusKey(){const t=todayKey();if(sel&&BYKEY[sel])return sel;if(BYDATE[t])return BYDATE[t].key;if(t<DAYS[0].date)return DAYS[0].key;return DAYS[DAYS.length-1].key;}
const doneCount=list=>list.filter(d=>!d.extra&&S.done[d.key]).length;
const coreOf=list=>list.filter(d=>!d.extra);
const weekDays=n=>DAYS.filter(d=>d.week===n);
function streak(){const t=todayKey();let i=DAYS.findIndex(d=>d.date===t);if(i<0){if(t>DAYS[DAYS.length-1].date)i=DAYS.length-1;else return 0;}
  if(!S.done[DAYS[i].key])i--;let n=0;while(i>=0){const d=DAYS[i];if(S.done[d.key])n++;else if(!d.extra)break;i--;}return n;}
function listDone(id){const l=LISTS.find(x=>x.id===id);return l.items.filter((_,i)=>S.checks[id+":"+i]).length;}
function phasePct(p){const days=CORE.filter(d=>p.weeks.includes(d.week));const l=LISTS.find(x=>x.id===p.id);const total=days.length+l.items.length;return total?Math.round(100*(doneCount(days)+listDone(p.id))/total):0;}
function currentPhase(){for(const p of PHASES){if(phasePct(p)<100)return p.id;}return "p5";}
const checksTotal=LISTS.reduce((a,l)=>a+l.items.length,0);
function stat(name){
  const [k,a]=name.split(":");
  if(k==="total")return doneCount(DAYS)+"/"+CORE.length;
  if(k==="streak")return String(streak());
  if(k==="week"){const w=coreOf(weekDays(+a));return doneCount(w)+"/"+w.length;}
  if(k==="planpct")return Math.round(100*doneCount(DAYS)/CORE.length)+"%";
  if(k==="checks")return Object.keys(S.checks).length+"/"+checksTotal;
  if(k==="list"){const l=LISTS.find(x=>x.id===a);return listDone(a)+"/"+l.items.length;}
  if(k==="phase")return phasePct(PHASES.find(p=>p.id===a))+"%";
  return "";
}
function bar(name){
  const [k,a]=name.split(":");
  if(k==="plan")return 100*doneCount(DAYS)/CORE.length;
  if(k==="week"){const w=coreOf(weekDays(+a));return 100*doneCount(w)/w.length;}
  if(k==="phase")return phasePct(PHASES.find(p=>p.id===a));
  if(k==="list"){const l=LISTS.find(x=>x.id===a);return 100*listDone(a)/l.items.length;}
  return 0;
}
const progress=(name,label)=>`<div class="progress" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(bar(name))}"><i data-bar="${name}" style="transform:translateX(-${100-bar(name)}%)"></i></div>`;

/* ---------- In-place updates (no full re-render on toggles, so transitions can play) ---------- */
function doneLabel(on){return on?`${ic("check")}Done`:`${ic("check")}Mark as done`;}
function setDoneBtn(btn,on){
  if(btn.getAttribute("aria-pressed")===String(on))return;
  btn.setAttribute("aria-pressed",String(on));
  const lab=btn.querySelector(".btn-label");
  if(reduceMotion()){lab.innerHTML=doneLabel(on);return;}
  lab.classList.add("swapping");
  setTimeout(()=>{lab.innerHTML=doneLabel(on);lab.classList.remove("swapping");},110);
}
function refresh(){
  document.querySelectorAll("[data-day]").forEach(el=>el.classList.toggle("is-done",!!S.done[el.dataset.day]));
  document.querySelectorAll("input[data-toggle]").forEach(el=>{el.checked=!!S.done[el.dataset.toggle];});
  document.querySelectorAll("button[data-toggle]").forEach(el=>setDoneBtn(el,!!S.done[el.dataset.toggle]));
  document.querySelectorAll("input[data-check]").forEach(el=>{el.checked=!!S.checks[el.dataset.check];const c=el.closest(".check");if(c)c.classList.toggle("is-done",el.checked);});
  document.querySelectorAll("[data-stat]").forEach(el=>{const v=stat(el.dataset.stat);if(el.textContent!==v)el.textContent=v;});
  document.querySelectorAll("[data-bar]").forEach(el=>{const v=bar(el.dataset.bar);el.style.transform=`translateX(-${100-v}%)`;el.parentElement.setAttribute("aria-valuenow",String(Math.round(v)));});
  const cur=currentPhase();
  document.querySelectorAll("[data-phase]").forEach(el=>{const p=PHASES.find(x=>x.id===el.dataset.phase),pct=phasePct(p);el.classList.toggle("current",p.id===cur);el.classList.toggle("complete",pct===100);});
}

/* ---------- Toast ---------- */
let toastEl=null,toastTimer=null;
function toast(title,desc){
  const host=document.getElementById("toaster");
  const html=`<span class="tic">${ic("check")}</span><div><div class="tt">${esc(title)}</div>${desc?`<div class="td">${esc(desc)}</div>`:""}</div>`;
  if(toastEl&&toastEl.dataset.state==="open"){toastEl.innerHTML=html;}
  else{
    if(toastEl)toastEl.remove();
    toastEl=document.createElement("div");toastEl.className="toast";toastEl.setAttribute("role","status");toastEl.innerHTML=html;host.appendChild(toastEl);
    const el=toastEl;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.dataset.state="open";}));
  }
  clearTimeout(toastTimer);toastTimer=setTimeout(closeToast,2600);
}
function closeToast(){if(document.hidden){toastTimer=setTimeout(closeToast,1000);return;}const el=toastEl;if(!el)return;el.dataset.state="closing";setTimeout(()=>{if(el.parentNode)el.remove();if(toastEl===el)toastEl=null;},220);}

/* ---------- Actions ---------- */
function toggleDay(key){
  const on=!S.done[key];
  if(on)S.done[key]=new Date().toISOString();else delete S.done[key];
  queueWrite();refresh();
  if(on){const d=BYKEY[key],left=CORE.length-doneCount(DAYS),st=streak();
    toast(`${d.extra?"Done":"Day "+(d.idx+1)+" done"} · ${d.title}`,`${st>1?st+"-day streak · ":""}${left} plan day${left===1?"":"s"} left in Phase 0–1`);}
}
function setStart(k){const changed=S.start&&S.start!==k;S.start=k;sel=null;queueWrite(0);if(location.hash!=="#today")location.hash="today";else{render();window.scrollTo(0,0);}
  toast(changed?"Start date changed":"Your plan is set",`Day 1 is ${fmtLong(k)}`);}
function toggleCheck(id){if(S.checks[id])delete S.checks[id];else S.checks[id]=true;queueWrite();refresh();}
function setJournal(key,field,val){const j=S.journal[key]||{w:"",f:"",n:""};j[field]=val;if(!j.w&&!j.f&&!j.n)delete S.journal[key];else S.journal[key]=j;queueWrite(900);}
function openDay(key){sel=key;if(location.hash!=="#today")location.hash="today";else{render();window.scrollTo(0,0);}}

const videoLink=(v,sub)=>`<a class="video" href="${esc(v.u)}" target="_blank" rel="noopener noreferrer"><span class="vt">${ic("yt")}</span><span class="vb"><b>${esc(v.t)}</b><small>${esc(sub||"Free on YouTube")}</small></span>${ic("ext")}</a>`;

      <button class="btn btn-outline btn-icon" data-open="${next?next.key:""}" ${next?"":"disabled"} aria-label="Next day">${ic("right")}</button>
    </div>
  </div>
  <section class="card hero" style="--tc:var(--t-${d.type})" aria-label="Task">
    <div class="card-header" style="gap:12px">
      <div class="meta"><span class="badge badge-type">${d.extra?"Optional":TYPE_LABEL[d.type]}</span><span>${ic("clock")}${esc(d.hours)}${d.time?" · "+esc(d.time):""}</span></div>

  }
  return `

    <div class="heat" style="grid-template-columns:48px repeat(7,1fr)"><span></span>${["M","T","W","T","F","S","S"].map(x=>`<span class="h">${x}</span>`).join("")}${rows}</div>
    <div class="legend"><span><i style="background:var(--primary);border-color:var(--primary)"></i>Done</span><span><i style="background:color-mix(in oklab,var(--foreground) 12%,var(--muted))"></i>Missed</span><span><i style="background:transparent;border-style:dashed"></i>Rest or optional</span><span><i style="box-shadow:0 0 0 1.5px var(--foreground)"></i>Today</span></div>
  </section>
  <section class="card" aria-label="Roadmap">
    <div class="card-header"><h3 class="card-title">Roadmap</h3><p class="card-desc">Phases 0–1 count days and checklist items; later phases count their checklist until their daily plans are added.</p></div>
    <div class="phases">${PHASES.map(p=>{const pct=phasePct(p);return `<div class="phase ${p.id===cur?"current":""} ${pct===100?"complete":""}" data-phase="${p.id}">
      <span class="pn">${p.n}</span><div><div class="pt">${esc(p.topic)}</div><div class="ps">${esc(p.span)}</div></div><span class="num muted" data-stat="phase:${p.id}">${pct}%</span>
      ${progress("phase:"+p.id,"Phase "+p.n+" progress")}</div>`;}).join("")}</div>
  </section>`;
}
function vLists(){
  return (S.start?startCard():"")+`<div class="page-head"><div><h1>Checklists</h1><p class="sub">Pass each phase's checklist before moving on. Free video lessons sit under each phase.</p></div><span class="badge badge-outline num" data-stat="checks">${stat("checks")}</span></div>`+
  LISTS.map(l=>`<section class="card" aria-label="${esc(l.title)}">
    <div class="card-header"><div class="wk-top" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3 class="card-title">${esc(l.title)}</h3><span class="badge badge-outline num" data-stat="list:${l.id}">${stat("list:"+l.id)}</span></div>${progress("list:"+l.id,l.title+" progress")}</div>
    <div class="checks">${l.items.map((it,i)=>{const id=l.id+":"+i,on=!!S.checks[id];return `<label class="check ${on?"is-done":""}" for="c-${l.id}-${i}"><input type="checkbox" class="cb" id="c-${l.id}-${i}" data-check="${id}" ${on?"checked":""}><span>${esc(it)}</span></label>`;}).join("")}</div>
    ${PHASE_VIDEOS[l.id]?`<div class="videos"><span class="section-label">Video lessons</span>${PHASE_VIDEOS[l.id].map(v=>videoLink(v)).join("")}</div>`:""}
  </section>`).join("")+backupCard();
}
function backupCard(){
  return `<section class="card" aria-label="Backup and move progress">
    <div class="card-header"><h3 class="card-title">Backup &amp; move progress</h3><p class="card-desc">Copy a backup code on one device and paste it on another to carry your ticks, checklists and journal across. Restoring replaces the progress on this device.</p></div>
    <div class="card-footer" style="flex-wrap:wrap"><button class="btn btn-outline" data-act="copy-backup">Copy backup code</button></div>
    <div class="field"><label for="restore">Restore from a backup code</label><textarea class="textarea" id="restore" placeholder="Paste a backup code here"></textarea></div>
    <div class="card-footer" style="flex-wrap:wrap"><button class="btn btn-primary" data-act="restore" id="restore-btn">Restore</button><span class="saved-hint" id="backup-msg" role="status"></span></div>
  </section>`;
}
const encodeBackup=()=>btoa(unescape(encodeURIComponent(JSON.stringify({v:2,start:S.start||null,done:S.done,checks:S.checks,journal:S.journal}))));
function decodeBackup(code){const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!o||typeof o!=="object"||!o.done)throw new Error("bad");return normalize(o);}
let restoreArmed=false;
async function copyBackup(){
  const code=encodeBackup(),msg=document.getElementById("backup-msg");
  try{await navigator.clipboard.writeText(code);msg.textContent="Backup code copied.";toast("Backup code copied","Paste it under Restore on your other device");}
  catch(e){const ta=document.getElementById("restore");ta.value=code;ta.focus();ta.select();msg.textContent="Copy the selected code above by hand.";}
}
function restoreBackup(){
  const ta=document.getElementById("restore"),msg=document.getElementById("backup-msg"),btn=document.getElementById("restore-btn");
  let next;try{next=decodeBackup(ta.value);}catch(e){msg.textContent="That code isn't a valid backup. Copy it again and paste the whole code.";restoreArmed=false;btn.textContent="Restore";return;}
  if(!restoreArmed){restoreArmed=true;btn.textContent="Replace my progress";msg.textContent=`Backup has ${Object.keys(next.done).length} days done. Tap again to replace this device's progress.`;return;}
  restoreArmed=false;S=next;queueWrite(0);render();toast("Progress restored",`${Object.keys(S.done).length} days done`);
}
function vJournal(){
  const keys=Object.keys(S.journal).filter(k=>BYKEY[k]).sort((a,b)=>BYKEY[b].idx-BYKEY[a].idx);
  const head=`<div class="page-head"><div><h1>Journal</h1><p class="sub">What worked, what failed, what's next</p></div>${keys.length?`<span class="badge badge-outline num">${keys.length} entr${keys.length===1?"y":"ies"}</span>`:""}</div>`;
  if(!keys.length)return head+`<div class="card empty"><span class="ic">${ic("book")}</span><h3 class="card-title">No entries yet</h3><p class="card-desc" style="max-width:40ch">After each session, write three lines on the Today tab. Re-read them at the end of every phase.</p><button class="btn btn-outline" data-act="today" style="margin-top:6px">Go to today</button></div>`;
  return head+keys.map(k=>{const j=S.journal[k],d=BYKEY[k];return `<article class="card entry">
    <div class="card-header split"><div class="card-header"><p class="card-desc">${esc(fmt(d.date,{weekday:"short",day:"numeric",month:"short",year:"numeric"}))} · Day ${d.idx+1} · Week ${d.week}</p><h3 class="card-title">${esc(d.title)}</h3></div><button class="btn btn-ghost" data-open="${k}" style="height:32px;padding:0 10px">Open${ic("right")}</button></div>
    <dl>${j.w?`<dt>Worked</dt><dd>${esc(j.w)}</dd>`:""}${j.f?`<dt>Failed</dt><dd>${esc(j.f)}</dd>`:""}${j.n?`<dt>Next</dt><dd>${esc(j.n)}</dd>`:""}</dl></article>`;}).join("");
}
const VIEWS={today:vToday,plan:vPlan,progress:vProgress,lists:vLists,journal:vJournal};
function tab(){const h=(location.hash||"").slice(1);return VIEWS[h]?h:"today";}
function render(){
  const a=document.activeElement,keep=a&&a.dataset&&a.dataset.j?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;
  schedule();const tb=tab();document.getElementById("view").innerHTML=VIEWS[tb]();
  document.querySelectorAll("[data-tab]").forEach(x=>{if(x.dataset.tab===tb)x.setAttribute("aria-current","page");else x.removeAttribute("aria-current");});
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e);}catch(e){}}}
}
const view=document.getElementById("view");
view.addEventListener("click",e=>{
  const tg=e.target.closest("button[data-toggle]");if(tg){toggleDay(tg.dataset.toggle);return;}
  const op=e.target.closest("[data-open]");if(op&&op.dataset.open){openDay(op.dataset.open);return;}
  if(e.target.closest("[data-act='set-start']")){const v=(document.getElementById("start-date")||{}).value;if(/^\d{4}-\d{2}-\d{2}$/.test(v||""))setStart(v);return;}
  if(e.target.closest("[data-act='start-today']")){setStart(todayKey());return;}
  if(e.target.closest("[data-act='start-monday']")){setStart(nextMonday(todayKey()));return;}
  if(e.target.closest("[data-act='copy-backup']")){copyBackup();return;}
  if(e.target.closest("[data-act='restore']")){restoreBackup();return;}
  const ac=e.target.closest("[data-act='today']");if(ac){sel=null;if(location.hash!=="#today")location.hash="today";else render();}
});
view.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("input[data-toggle]")){if(!!S.done[t.dataset.toggle]!==t.checked)toggleDay(t.dataset.toggle);return;}
  if(t.matches("input[data-check]"))toggleCheck(t.dataset.check);
});
view.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.j)setJournal(t.dataset.key,t.dataset.j,t.value);});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();setStatus("connecting");initSync();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
